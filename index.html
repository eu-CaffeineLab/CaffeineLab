<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaffeineLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        h1 {
            color: #2a5298;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .coffee-emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #2a5298;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 10px;
        }
        .btn:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="coffee-emoji">☕</div>
        <h1>CaffeineLab</h1>
        <p>Welcome to CaffeineLab! Your project is coming soon.</p>
        <p>Stay tuned for updates!</p>
        <a href="https://github.com/eu-CaffeineLab/CaffeineLab" class="btn">View on GitHub</a>
    </div>
</body>
</html>
